<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Expeditie Molven</title>
<style>
:root{--bg:#05080a;--ink:#efe6d0;--mute:#9aa59b;--green:#2bd96b;--glow:rgba(43,217,107,.35);--card:#0b1210;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="light"],:root:not([data-theme="light"]){color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,'Times New Roman',serif;line-height:1.6}
.hero{position:relative;text-align:center;padding:40px 20px 60px;background:radial-gradient(ellipse at 50% 0%,#12301f 0%,var(--bg) 65%)}
.hero img{width:min(520px,92%);height:auto;border-radius:12px;box-shadow:0 0 80px var(--glow)}
h1,h2,.btn{font-family:Impact,Haettenschweiler,'Arial Narrow Bold',sans-serif;letter-spacing:.04em;text-transform:uppercase;font-weight:400}
.tag{font-size:clamp(1.2rem,3.4vw,1.8rem);margin:28px auto 8px;max-width:640px;font-style:italic}
.sub{color:var(--mute);max-width:560px;margin:0 auto 28px}
.btn{display:inline-block;background:var(--green);color:#03120a;padding:14px 30px;border-radius:6px;text-decoration:none;font-size:1.15rem;box-shadow:0 0 24px var(--glow)}
section{max-width:900px;margin:0 auto;padding:48px 20px}
h2{font-size:2rem;color:var(--green);text-align:center;margin:0 0 24px}
.frame{border:1px solid #1d3a29;border-radius:10px;overflow:hidden;background:#000;box-shadow:0 0 40px rgba(43,217,107,.12)}
video{display:block;width:100%;max-height:70vh;background:#000}
.empty{padding:70px 20px;text-align:center;color:var(--mute);font-style:italic}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.card{background:var(--card);border:1px solid #1d3a29;border-radius:10px;padding:22px}
.card h3{margin:0 0 6px;color:var(--ink);font-family:Impact,sans-serif;font-weight:400;letter-spacing:.04em;text-transform:uppercase}
.card p{margin:0;color:var(--mute)}
.txt{margin-top:28px;font-size:1.1rem}.txt p{margin:0 0 14px}
.panel{padding:16px;border:1px dashed #2f6a47;border-radius:10px;text-align:center}
.panel textarea{width:100%;margin:10px 0;background:#08100c;color:var(--ink);border:1px solid #2f6a47;border-radius:6px;padding:10px;font:inherit}
.note{color:var(--mute);font-size:.85rem}
img.ph{display:block;width:100%;height:auto}
#admin button,#admin label{background:#13261c;color:var(--ink);border:1px solid #2f6a47;border-radius:6px;padding:9px 16px;cursor:pointer;font:inherit;margin:4px}
#admin input[type=file]{display:none}
#msg{color:var(--mute);font-size:.9rem;margin:8px 0 0}
footer{text-align:center;color:var(--mute);padding:30px 20px 50px;font-size:.9rem}
</style>
</head>
